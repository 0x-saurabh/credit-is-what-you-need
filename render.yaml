# Render Blueprint for Kredit.
#
# Users, credits, purchases and API keys live in Neon Postgres (DATABASE_URL),
# so the service itself keeps nothing on disk and survives restarts and deploys
# on any plan. Apply it from the Render dashboard: New > Blueprint > pick this
# repository.
services:
  - type: web
    name: kredit
    runtime: node
    plan: starter
    repo: https://github.com/saurabh-sol/credit-is-what-you-need
    branch: main
    # Rate limits and credit holds are kept in memory, so run a single instance.
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The Neon Postgres connection string (Neon console → Connect → pooled URL).
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Set these in the dashboard; they are secrets or deployment choices.
      # Privy signs people in. The app id is read at build time: redeploy after setting it.
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: UPSTREAM_BASE_URL
        sync: false
      - key: UPSTREAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Payments (Dodo Payments); see .env.example.
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        sync: false
